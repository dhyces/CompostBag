plugins {
    id 'java'
    id 'maven-publish'
    id 'org.groovymc.modsdotgroovy'
    id 'dev.architectury.loom'
}

base {
    archivesName = "${mod_name}-common-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.4:2024.02.25@zip")
    }
    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

modsDotGroovy {
    multiplatform {
        gather {
            projectProperty("mod_id")
            projectProperty("mod_name")
            projectProperty("mod_author")
        }
        expose()
    }
}