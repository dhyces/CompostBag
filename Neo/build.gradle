import org.groovymc.modsdotgroovy.gradle.tasks.AbstractGatherPlatformDetailsTask

plugins {
    id 'idea'
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'org.groovymc.modsdotgroovy'
    id 'dev.architectury.loom'
}

base {
    archivesName = "${mod_name}-Neo-${minecraft_version}"
}

loom {
    neoForge {
        accessTransformer(project.file('src/main/resources/META-INF/accesstransformer.cfg'))
    }
    runs {
        client {
            client()
            setConfigName("Neo Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Neo Server")
            ideConfigGenerated(true)
            runDir("runServer")
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenLocal()
    maven {
        name = 'Neo'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    neoForge "net.neoforged:neoforge:${neo_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.2:2023.12.10@zip")
    }

    compileOnly project(":Common")
}

tasks.withType(JavaCompile).configureEach {
    source(project(":Common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":Common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
}

processResources {
    from project(":Common").sourceSets.main.resources
    rename "mods.toml", "neoforge.mods.toml"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

modsDotGroovy {
    platform = org.groovymc.modsdotgroovy.core.Platform.NEOFORGE
    inferGather.set false
    multiplatform {
        from ':Common'
    }
    apply()
}

tasks.named('gatherNeoForgePlatformDetails', AbstractGatherPlatformDetailsTask).configure {
    minecraftVersion = '24w13a'
    platformVersion = '20.5.0-alpha.24w13a.20240328.230204'
//    buildProperties.put("mod_id", mod_id)
//    buildProperties.put("loader_version_range", loader_version_range)
//    buildProperties.put("neo_version_range", neo_version_range)
}